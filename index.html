<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Calendario de Adviento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="escena">
    <div id="marco">
      <canvas id="lienzo" width="320" height="240"></canvas>
      <div id="hud">
        <div id="info"></div>
        <dl id="leyenda" aria-label="Controles">
          <div><dt>← →</dt><dd>Andar</dd></div>
          <div><dt>↑ ↓</dt><dd>Subir y bajar (en la escalera)</dd></div>
          <div><dt>Espacio / Enter</dt><dd>Abrir puerta</dd></div>
          <div><dt>Esc</dt><dd>Cerrar / salir de pantalla completa</dd></div>
        </dl>
      </div>
      <button id="pantalla-completa" type="button" title="Pantalla completa" aria-label="Pantalla completa">
        <svg viewBox="0 0 10 10" fill="currentColor"><path d="M0 0h4v1H1v3H0zM6 0h4v4H9V1H6zM0 6h1v3h3v1H0zM9 6h1v4H6V9h3z"/></svg>
      </button>
      <button id="silencio" type="button" title="Sonido" aria-label="Activar o silenciar el sonido">♪</button>
      <div id="pista"></div>
      <div id="dialogo" class="oculto" role="dialog" aria-live="polite">
        <canvas id="dialogo-retrato" width="32" height="40"></canvas>
        <div class="bocadillo">
          <div id="dialogo-nombre"></div>
          <p id="dialogo-texto"></p>
          <span id="dialogo-sigue">▼</span>
        </div>
      </div>
      <div id="pantalla-juego" class="oculto" role="dialog" aria-label="Minijuego">
        <div id="juego-contenedor"></div>
        <button id="juego-cerrar" class="boton-pixel" type="button" aria-label="Cerrar el minijuego">X</button>
      </div>
    </div>
  </div>

  <div id="tactil" aria-label="Controles táctiles">
    <div class="grupo">
      <button class="tecla" data-tecla="izquierda" aria-label="Izquierda">◀</button>
      <button class="tecla" data-tecla="derecha" aria-label="Derecha">▶</button>
    </div>
    <div class="grupo">
      <button class="tecla" data-tecla="arriba" aria-label="Subir">▲</button>
      <button class="tecla" data-tecla="abajo" aria-label="Bajar">▼</button>
    </div>
    <div class="grupo">
      <button class="tecla grande" data-tecla="accion">ABRIR</button>
    </div>
  </div>

  <div id="modal" class="oculto" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="caja" tabindex="-1">
      <div class="barra">
        <span id="modal-dia"></span>
        <button id="modal-cerrar" class="boton-pixel" aria-label="Cerrar">X</button>
      </div>
      <h2 id="modal-titulo"></h2>
      <img id="modal-foto" class="oculto" alt="">
      <p id="modal-texto"></p>
      <div id="modal-juego"></div>
    </div>
  </div>

  <noscript>Este calendario necesita JavaScript.</noscript>

  <script src="js/sprites.js"></script>
  <script src="js/edificio.js"></script>
  <script src="js/sonido.js"></script>
  <script src="js/dias.js"></script>
  <script src="juegos/comun.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
